<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator de Albume Foto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Stiluri custom -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Librarie export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📸 Generator de Albume Foto</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row">
            <!-- Panou Control / Setări (Stânga) -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm p-3">
                    <h5 class="card-title mb-3">1. Detalii Album</h5>
                    <div class="mb-3">
                        <label for="albumTitle" class="form-label">Titlu Album:</label>
                        <input type="text" id="albumTitle" class="form-control" placeholder="Ex: Vacanța de Vară">
                    </div>
                    <div class="mb-3">
                        <label for="albumSub" class="form-label">Subtitlu / An:</label>
                        <input type="text" id="albumSub" class="form-control" placeholder="Ex: Grecia 2026">
                    </div>

                    <h5 class="card-title mt-4 mb-3">2. Adăugare Imagini</h5>
                    <div class="mb-3">
                        <input type="file" id="imageInput" class="form-control" accept="image/*" multiple>
                    </div>

                    <h5 class="card-title mt-4 mb-3">3. Acțiuni</h5>
                    <div class="d-grid gap-2">
                        <button id="generateBtn" class="btn btn-primary">Actualizează Previzualizarea</button>
                        <button id="downloadPdfBtn" class="btn btn-success">📥 Descarcă Albumul PDF</button>
                    </div>
                </div>
            </div>

            <!-- Zona de Previzualizare (Dreapta) -->
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h5 class="card-title mb-3">Previzualizare Album</h5>
                    
                    <!-- Suprafața exportabilă în PDF -->
                    <div id="albumContainer" class="album-paper p-4 bg-white border">
                        <div class="text-center mb-4">
                            <h1 id="previewTitle" class="display-5 text-primary">Titlul Albumului</h1>
                            <p id="previewSub" class="lead text-muted">Subtitlul albumului va apărea aici</p>
                            <hr class="my-4">
                        </div>
                        
                        <!-- Grila cu poze -->
                        <div id="photoGrid" class="row g-3">
                            <p class="text-center text-muted py-5" id="emptyNotice">Nicio imagine încărcată. Selectează imagini din panoul din stânga.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripturi JavaScript -->
    <script src="app.js"></script>
</body>
</html>
